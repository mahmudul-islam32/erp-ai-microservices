services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: erp-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: erp_auth
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - erp-network

  # Auth Service
  auth-service:
    build: 
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: erp-auth-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      ENVIRONMENT: development
      MONGODB_URL: mongodb://admin:password123@mongodb:27017/erp_auth?authSource=admin
      DATABASE_NAME: erp_auth
      SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-key-change-this-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      SERVICE_NAME: auth-service
      SERVICE_PORT: 8001
      SERVICE_HOST: 0.0.0.0
      LOG_LEVEL: INFO
      SALES_SERVICE_URL: http://sales-service:8003
    depends_on:
      - mongodb
    volumes:
      - ./auth-service:/app
    networks:
      - erp-network

  # Inventory Service
  inventory-service:
    build: 
      context: ./inventory-service
      dockerfile: Dockerfile.dev
    container_name: erp-inventory-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      NODE_ENV: development
      PORT: 8002
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/erp_inventory?authSource=admin
      AUTH_SERVICE_URL: http://auth-service:8001
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      JWT_SECRET: ${JWT_SECRET_KEY:-your-super-secret-key-change-this-in-production}
    depends_on:
      - mongodb
      - auth-service
    volumes:
      - ./inventory-service/src:/app/src
      - ./inventory-service/package.json:/app/package.json
      - ./inventory-service/package-lock.json:/app/package-lock.json
      - ./inventory-service/tsconfig.json:/app/tsconfig.json
      - ./inventory-service/tsconfig.build.json:/app/tsconfig.build.json
      - ./inventory-service/nest-cli.json:/app/nest-cli.json
      - inventory_uploads:/app/uploads
    networks:
      - erp-network

  # Sales Service
  sales-service:
    build: 
      context: ./sales-service
      dockerfile: Dockerfile
    container_name: erp-sales-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      ENVIRONMENT: development
      MONGODB_URL: mongodb://admin:password123@mongodb:27017/erp_sales?authSource=admin
      DATABASE_NAME: erp_sales
      AUTH_SERVICE_URL: http://auth-service:8001
      INVENTORY_SERVICE_URL: http://inventory-service:8002
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-key-change-this-in-production}
      SERVICE_NAME: Sales Service
      SERVICE_VERSION: 1.0.0
      SERVICE_PORT: 8003
      SERVICE_HOST: 0.0.0.0
      LOG_LEVEL: INFO
      DEBUG: "true"
      DEFAULT_TAX_RATE: 0.08
      DEFAULT_CURRENCY: USD
      REDIS_URL: redis://redis:6379
      # Stripe Payment Gateway
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_VERSION: "2023-10-16"
      STRIPE_CURRENCY: usd
    depends_on:
      - mongodb
      - auth-service
      - inventory-service
    volumes:
      - ./sales-service:/app
    networks:
      - erp-network

  # Notification Service
  notification-service:
    build: 
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: erp-notification-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      ENVIRONMENT: development
      MONGODB_URL: mongodb://admin:password123@mongodb:27017/erp_notifications?authSource=admin
      DATABASE_NAME: erp_notifications
      AUTH_SERVICE_URL: http://auth-service:8001
      SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-key-change-this-in-production}
      ALGORITHM: HS256
      SERVICE_NAME: notification-service
      SERVICE_PORT: 8004
      SERVICE_HOST: 0.0.0.0
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379
      WEBSOCKET_HEARTBEAT_INTERVAL: 30
    depends_on:
      - mongodb
      - auth-service
      - redis
    volumes:
      - ./notification-service:/app
    networks:
      - erp-network

  # Chat Service
  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: erp-chat-service
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      ENVIRONMENT: development
      MONGODB_URL: mongodb://admin:password123@mongodb:27017/erp_chat?authSource=admin
      DATABASE_NAME: erp_chat
      AUTH_SERVICE_URL: http://auth-service:8001
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-key-change-this-in-production}
      JWT_ALGORITHM: HS256
      SERVICE_NAME: Chat Service
      SERVICE_VERSION: 1.0.0
      SERVICE_PORT: 8005
    depends_on:
      - mongodb
      - auth-service
    volumes:
      - ./chat-service:/app
    networks:
      - erp-network

  # Finance Service
  finance-service:
    build:
      context: ./finance-service
      dockerfile: Dockerfile
    container_name: erp-finance-service
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      ENVIRONMENT: development
      MONGODB_URL: mongodb://admin:password123@mongodb:27017/erp_finance?authSource=admin
      DATABASE_NAME: erp_finance
      AUTH_SERVICE_URL: http://auth-service:8001
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      SALES_SERVICE_URL: http://sales-service:8003
      INVENTORY_SERVICE_URL: http://inventory-service:8002
      SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-key-change-this-in-production}
      ALGORITHM: HS256
      SERVICE_NAME: Finance Service
      SERVICE_VERSION: 1.0.0
      SERVICE_PORT: 8006
      SERVICE_HOST: 0.0.0.0
      LOG_LEVEL: INFO
      DEFAULT_CURRENCY: USD
      FISCAL_YEAR_START_MONTH: 1
      DECIMAL_PLACES: 2
    depends_on:
      - mongodb
      - auth-service
      - notification-service
    volumes:
      - ./finance-service:/app
    networks:
      - erp-network

  # HRM Service
  hrm-service:
    build:
      context: ./hrm-service
      dockerfile: Dockerfile
    container_name: erp-hrm-service
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      ENVIRONMENT: development
      MONGODB_URL: mongodb://admin:password123@mongodb:27017/erp_hrm?authSource=admin
      DATABASE_NAME: erp_hrm
      AUTH_SERVICE_URL: http://auth-service:8001
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-key-change-this-in-production}
      ALGORITHM: HS256
      SERVICE_NAME: HRM Service
      SERVICE_VERSION: 1.0.0
      SERVICE_PORT: 8007
      SERVICE_HOST: 0.0.0.0
      LOG_LEVEL: INFO
      DEFAULT_CURRENCY: USD
      DEFAULT_TIMEZONE: UTC
      MAX_LEAVE_DAYS_PER_YEAR: 30
      DEFAULT_WORKING_HOURS_PER_DAY: 8.0
      OVERTIME_THRESHOLD_HOURS: 40.0
      OVERTIME_MULTIPLIER: 1.5
      DEFAULT_TAX_RATE: 0.20
      SOCIAL_SECURITY_RATE: 0.062
      MEDICARE_RATE: 0.0145
      REVIEW_PERIOD_MONTHS: 12
      RATING_SCALE_MAX: 5
      APPLICATION_EXPIRY_DAYS: 30
      INTERVIEW_SLOTS_PER_DAY: 8
      CERTIFICATION_VALIDITY_YEARS: 2
      MANDATORY_TRAINING_HOURS: 40
      HEALTH_INSURANCE_CONTRIBUTION: 0.20
      RETIREMENT_MATCH_PERCENTAGE: 0.05
    depends_on:
      - mongodb
      - auth-service
      - notification-service
    volumes:
      - ./hrm-service:/app
    networks:
      - erp-network

  # AI Chatbot Service
  ai-chatbot-service:
    build:
      context: ./ai-chatbot-service
      dockerfile: Dockerfile
    container_name: erp-ai-chatbot-service
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      ENVIRONMENT: development
      MONGODB_URL: mongodb://admin:password123@mongodb:27017/erp_ai_chatbot?authSource=admin
      DATABASE_NAME: erp_ai_chatbot
      AUTH_SERVICE_URL: http://auth-service:8001
      SALES_SERVICE_URL: http://sales-service:8003
      INVENTORY_SERVICE_URL: http://inventory-service:8002
      FINANCE_SERVICE_URL: http://finance-service:8006
      HRM_SERVICE_URL: http://hrm-service:8007
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-key-change-this-in-production}
      JWT_ALGORITHM: HS256
      SERVICE_NAME: AI Chatbot Service
      SERVICE_VERSION: 1.0.0
      SERVICE_PORT: 8008
      LOG_LEVEL: INFO
      # LLM Provider Configuration
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-gpt-4o-mini}
      # OpenAI Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: 0.7
      OPENAI_MAX_TOKENS: 1000
      # Hugging Face Configuration
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      HUGGINGFACE_MODEL: ${HUGGINGFACE_MODEL:-microsoft/DialoGPT-medium}
      HUGGINGFACE_BASE_URL: ${HUGGINGFACE_BASE_URL:-https://api-inference.huggingface.co}
      MAX_CONVERSATION_HISTORY: 20
    depends_on:
      - mongodb
      - auth-service
    volumes:
      - ./ai-chatbot-service:/app
    networks:
      - erp-network

  # Redis for caching and background tasks
  redis:
    image: redis:7.2-alpine
    container_name: erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - erp-network

  # MongoDB Express (Development only)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: erp-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - erp-network
    profiles:
      - development

  # Frontend React Application (Production)
  frontend:
    build:
      context: ./erp-frontend
      dockerfile: Dockerfile
      args:
        - VITE_AUTH_SERVICE_URL=http://localhost:8001
        - VITE_INVENTORY_SERVICE_URL=http://localhost:8002
        - VITE_SALES_SERVICE_URL=http://localhost:8003
        - VITE_NOTIFICATION_SERVICE_URL=http://localhost:8004
        - VITE_CHAT_SERVICE_URL=http://localhost:8005
        - VITE_HRM_SERVICE_URL=http://localhost:8007
        - VITE_STRIPE_PUBLIC_KEY=${STRIPE_PUBLISHABLE_KEY:-}
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - inventory-service
      - sales-service
      - notification-service
    networks:
      - erp-network
    profiles:
      - production
      
  # Frontend React Application (Development with hot-reload)
  frontend-dev:
    build:
      context: ./erp-frontend
      dockerfile: Dockerfile.dev
    container_name: erp-frontend-dev
    restart: unless-stopped
    ports:
      - "8080:5173"
    environment:
      VITE_AUTH_SERVICE_URL: http://localhost:8001
      VITE_INVENTORY_SERVICE_URL: http://localhost:8002
      VITE_SALES_SERVICE_URL: http://localhost:8003
      VITE_NOTIFICATION_SERVICE_URL: http://localhost:8004
      VITE_CHAT_SERVICE_URL: http://localhost:8005
      VITE_HRM_SERVICE_URL: http://localhost:8007
      VITE_STRIPE_PUBLIC_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      VITE_HMR_PORT: 8080
    volumes:
      - ./erp-frontend/src:/app/src
      - ./erp-frontend/public:/app/public
      - ./erp-frontend/index.html:/app/index.html
      - ./erp-frontend/vite.config.ts:/app/vite.config.ts
      - ./erp-frontend/tailwind.config.js:/app/tailwind.config.js
      - ./erp-frontend/postcss.config.js:/app/postcss.config.js
      - ./erp-frontend/tsconfig.json:/app/tsconfig.json
      - ./erp-frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./erp-frontend/package.json:/app/package.json
      - ./erp-frontend/package-lock.json:/app/package-lock.json
      - /app/node_modules
    depends_on:
      - auth-service
      - inventory-service
      - sales-service
      - notification-service
    networks:
      - erp-network

volumes:
  mongodb_data:
  redis_data:
  inventory_uploads:

networks:
  erp-network:
    driver: bridge
