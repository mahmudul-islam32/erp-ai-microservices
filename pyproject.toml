[tool.ruff]
target-version = "py311"
line-length = 120

exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    ".terraform",
]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, flake8-bugbear.
select = ["E", "F", "B"]
ignore = [
    "E501",  # line length — cosmetic, not worth failing CI over
    "B008",  # FastAPI's Depends()/Query() defaults are the documented idiom
    "B904",  # `raise ... from err` — stylistic; would touch 277 call sites
    "E402",  # several main.py files load env before importing app modules
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export names for the public API surface.
"**/__init__.py" = ["F401", "F811"]
# main.py files configure sys.path/env before importing app modules.
"**/main.py" = ["E402"]
