name: Deploy ERP Microservices to AWS EC2

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  # Optional: Separate workflow for infrastructure changes
  # push:
  #   paths:
  #     - 'terraform/**'
  #     - '.github/workflows/deploy.yml'

env:
  AWS_REGION: us-east-1
  REGISTRY: ghcr.io
  IMAGE_PREFIX: mahmudul-islam32/erp
  TF_VERSION: 1.6.0

jobs:
  # Terraform Infrastructure Job (runs on infrastructure changes or manual trigger)
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[terraform]')
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.terraform-plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply_terraform == 'true'
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve

      - name: Get EC2 IP
        id: terraform-output
        working-directory: ./terraform
        run: |
          echo "instance_ip=$(terraform output -raw elastic_ip || terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service:
          - name: auth-service
            context: ./auth-service
            dockerfile: Dockerfile
          - name: inventory-service
            context: ./inventory-service
            dockerfile: Dockerfile
          - name: sales-service
            context: ./sales-service
            dockerfile: Dockerfile
          - name: frontend
            context: ./erp-frontend
            dockerfile: Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_AUTH_SERVICE_URL=${{ secrets.VITE_AUTH_SERVICE_URL || 'http://localhost:8001' }}
            VITE_INVENTORY_SERVICE_URL=${{ secrets.VITE_INVENTORY_SERVICE_URL || 'http://localhost:8002' }}
            VITE_SALES_SERVICE_URL=${{ secrets.VITE_SALES_SERVICE_URL || 'http://localhost:8003' }}
            VITE_STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get EC2 IP from Terraform (if available)
        id: get-ec2-ip
        run: |
          if [ -f terraform/terraform.tfstate ]; then
            cd terraform
            EC2_IP=$(terraform output -raw elastic_ip 2>/dev/null || terraform output -raw instance_public_ip 2>/dev/null || echo "")
            if [ -n "$EC2_IP" ]; then
              echo "ip=$EC2_IP" >> $GITHUB_OUTPUT
              echo "✅ Found EC2 IP from Terraform: $EC2_IP"
            else
              echo "⚠️ Could not get IP from Terraform, using secret"
            fi
          else
            echo "⚠️ Terraform state not found, using EC2_HOST secret"
          fi

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ steps.get-ec2-ip.outputs.ip || secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          if [ -z "$HOST" ]; then
            echo "❌ Error: EC2 host not found. Please set EC2_HOST secret or run Terraform first."
            exit 1
          fi
          
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # Copy production docker-compose file to EC2
          scp -o StrictHostKeyChecking=no -i private_key.pem \
            docker-compose.prod.yml $USER@$HOST:~/erp/docker-compose.yml
          
          # Deploy on EC2
          ssh -o StrictHostKeyChecking=no -i private_key.pem $USER@$HOST \
            "GITHUB_TOKEN='$GITHUB_TOKEN' GITHUB_ACTOR='$GITHUB_ACTOR' IMAGE_PREFIX='$IMAGE_PREFIX' bash -s" << 'EOSSH'
            set -e
            
            # Fix Docker permissions - ensure ubuntu user can use docker
            sudo usermod -aG docker ubuntu || true
            mkdir -p ~/.docker
            sudo chown -R ubuntu:ubuntu ~/.docker || true
            chmod 755 ~/.docker || true
            
            # Apply group changes without logout
            newgrp docker 2>/dev/null || true
            
            # Create directory if it doesn't exist
            mkdir -p ~/erp
            cd ~/erp
            
            # Check if .env exists (optional, using defaults if not present)
            if [ -f .env ]; then
              echo "✅ Found .env file, loading custom configuration..."
              source .env
            else
              echo "ℹ️  No .env file found, using default configuration"
              echo "⚠️  WARNING: Using default MongoDB password 'password123'"
              echo "⚠️  WARNING: Using default JWT secret"
              echo "ℹ️  For production, create ~/erp/.env with secure values"
            fi
            
            # Set image variables from GitHub (passed as environment variables)
            export IMAGE_REGISTRY=ghcr.io
            export IMAGE_PREFIX="mahmudul-islam32/erp"
            export IMAGE_TAG=latest
            
            # Login to GitHub Container Registry
            # Try without sudo first, fallback to sudo if needed
            if docker info > /dev/null 2>&1; then
              echo "✅ Docker accessible without sudo"
              USE_SUDO=""
            else
              echo "⚠️ Docker requires sudo, using sudo for all commands"
              USE_SUDO="sudo"
            fi
            
            # Login to registry
            echo "🔐 Logging into GitHub Container Registry..."
            if [ -n "$USE_SUDO" ]; then
              echo "$GITHUB_TOKEN" | sudo docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            else
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            fi
            
            # Determine docker compose command (try plugin first, then standalone)
            if [ -n "$USE_SUDO" ]; then
              if sudo docker compose version > /dev/null 2>&1; then
                COMPOSE_CMD="sudo docker compose"
              elif sudo docker-compose version > /dev/null 2>&1; then
                COMPOSE_CMD="sudo docker-compose"
              else
                echo "❌ Error: docker compose not found"
                exit 1
              fi
            else
              if docker compose version > /dev/null 2>&1; then
                COMPOSE_CMD="docker compose"
              elif docker-compose version > /dev/null 2>&1; then
                COMPOSE_CMD="docker-compose"
              else
                echo "❌ Error: docker compose not found"
                exit 1
              fi
            fi
            
            echo "Using: $COMPOSE_CMD"
            
            # Pull latest images
            echo "📥 Pulling latest images..."
            eval "$COMPOSE_CMD pull" || {
              echo "❌ Failed to pull images"
              exit 1
            }
            
            # Stop old containers
            echo "🛑 Stopping old containers..."
            eval "$COMPOSE_CMD down" || true
            
            # Start services
            echo "🚀 Starting services..."
            eval "$COMPOSE_CMD up -d" || {
              echo "❌ Failed to start services"
              eval "$COMPOSE_CMD logs"
              exit 1
            }
            
            # Wait for services to start
            echo "⏳ Waiting for services to start..."
            sleep 45
            
            # Check container status
            echo "📊 Container status:"
            eval "$COMPOSE_CMD ps"
            
            # Health check
            echo "🏥 Checking service health..."
            max_retries=5
            for i in $(seq 1 $max_retries); do
              if curl -f http://localhost:8001/health > /dev/null 2>&1; then
                echo "✅ Auth service is healthy"
                break
              else
                echo "⏳ Waiting for auth service (attempt $i/$max_retries)..."
                sleep 10
              fi
            done
            
            # Check logs for errors
            echo "📋 Recent logs:"
            eval "$COMPOSE_CMD logs --tail=20"
            
            # Cleanup old images
            echo "🧹 Cleaning up old images..."
            if [ -n "$USE_SUDO" ]; then
              sudo docker image prune -af --filter "until=24h" || true
            else
              docker image prune -af --filter "until=24h" || true
            fi
            
            echo "✅ Deployment completed successfully!"
          EOSSH
          
          rm -f private_key.pem

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
