name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auth-service-tests:
    name: Auth service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: auth-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: auth-service
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: auth-service
        env:
          MONGODB_URL: mongodb://localhost:27017
          SECRET_KEY: ci-secret-key-not-used-for-anything-real
        run: pytest

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff==0.1.14

      - name: Lint
        run: ruff check .

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: erp-frontend/package-lock.json

      - name: Install dependencies
        working-directory: erp-frontend
        run: npm ci

      - name: Type check
        working-directory: erp-frontend
        run: npm run typecheck

      # `npm run build` runs tsc and then vite build.
      - name: Build
        working-directory: erp-frontend
        run: npm run build

      # ESLint is not gated yet: ~28 unused-variable errors remain, and
      # no-explicit-any is a warning until the project can enable strict mode.
      - name: Lint (advisory)
        working-directory: erp-frontend
        run: npm run lint || true
